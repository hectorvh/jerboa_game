# Kept in the package directory as well: if the Netlify UI sets Base directory
# to `jerboa-s-journey`, Netlify looks here for config. Same settings as the
# repo-root file — keep them in sync.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_JERBOA_BACKEND = "memory"
